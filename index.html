    <!-- Font Awesome for Icons -->

    <style>
        body {
            background-color: #121212;
            color: #e5e7eb;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
            min-height: 100vh;
        }
        .parchment {
            background-color: #f4e4bc;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
            color: #2d3748;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #E22822;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        const CLASS_FEATURES_FALLBACK = {
            barbarian: [
                { name: 'Rage', desc: ['You can imbue yourself with a primal power called Rage, a force that grants you extraordinary might and resilience. You can enter it as a Bonus Action if you are not wearing Heavy armor. While active, you gain Resistance to Bludgeoning, Piercing, and Slashing damage and Advantage on Strength checks and saving throws.'] },

            ],
            bard: [
                { name: 'Spellcasting', desc: ['You have learned to untangle and reshape the fabric of reality in accordance with your raw will.'] },
                { name: 'Bardic Inspiration', desc: ['You can inspire others through stirring words or music. To do so, you use a Bonus Action on your turn to choose one creature other than yourself within 60 feet of you who can hear you. That creature gains one Bardic Inspiration die, a d6.'] }
            ],
            cleric: [

                { name: 'Divine Domain', desc: ['Choose one domain related to your deity, such as Life or Light, granting you domain spells and other features.'] }
            ],
            druid: [

            ],
            fighter: [
                { name: 'Fighting Style', desc: ['You adopt a particular style of fighting as your specialty, granting specific tactical bonuses.'] },

            ],

            artificer: [

                { name: 'Spellcasting', desc: ['You have studied the inner workings of magic and can cast artificer spells using artisan tools as spellcasting foci.'] }
            ]

        const fetchAPI = async (endpoint) => {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`${API_BASE}/${endpoint}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                return data.results || [];
            } catch (err) {
                if (endpoint === 'classes') return FALLBACK_CLASSES;
                if (endpoint === 'races') return FALLBACK_RACES;
                return [];
            }
        };

        const fetchDetails = async (url) => {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`https://www.dnd5eapi.co${url}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (err) {
                return null;
            }
        };

        const getAsiCount = (charClass, level) => {
            if (!charClass) return 0;
            const cls = charClass.index;
            let levels = [];
            if (cls === 'fighter') {
                levels = [4, 6, 8, 12, 14, 16, 19];
            } else if (cls === 'rogue') {
                levels = [4, 8, 10, 12, 16, 19];
            } else {
                levels = [4, 8, 12, 16, 19];
            }
            return levels.filter(l => level >= l).length;
        };

        const CharacterSheet = ({ character, onEdit }) => {
            const getFinalScore = (stat) => (character.baseStats[stat] || 10) + (character.racialBonuses[stat] || 0) + (character.asiBonuses[stat] || 0);

            return (
                <div className="parchment p-8 rounded-lg shadow-2xl max-w-4xl w-full mx-auto font-serif">
                    <div className="border-b-4 border-red-800 pb-4 mb-6 flex justify-between items-end">
                        <div>
                            <h1 className="text-4xl font-bold text-red-900 uppercase tracking-wider">{character.name || "Unnamed Hero"}</h1>
                            <div className="text-lg text-gray-700 mt-2">
                                {character.race?.name || "Unknown Race"} {character.subclass ? `(${character.subclass.name}) ` : ''}{character.charClass?.name || "Unknown Class"} - Level {character.level}
                            </div>
                        </div>
                        <button onClick={onEdit} className="px-4 py-2 bg-gray-800 text-white rounded hover:bg-gray-700 transition text-sm font-sans">
                            <i className="fa-solid fa-pen mr-2"></i>Edit Character
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* Stats Column */}
                        <div className="col-span-1 space-y-4">
                            <div className="bg-white/50 p-4 border-2 border-gray-400 rounded-lg shadow-sm">
                                <h3 className="text-center font-bold text-gray-800 border-b border-gray-400 pb-1 mb-3 uppercase tracking-widest text-sm">Ability Scores</h3>
                                <div className="space-y-3">
                                    {['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].map(stat => {
                                        const finalVal = getFinalScore(stat);
                                        const mod = Math.floor((finalVal - 10) / 2);
                                        return (
                                            <div key={stat} className="flex justify-between items-center bg-white p-2 rounded border border-gray-300">
                                                <span className="font-bold text-gray-600 w-12">{stat}</span>
                                                <div className="text-center">
                                                    <span className="text-xl font-bold text-red-900">{finalVal}</span>
                                                    <div className="text-[10px] text-gray-500">
                                                        (Base:{character.baseStats[stat]} + R:{character.racialBonuses[stat] || 0} + ASI:{character.asiBonuses[stat] || 0})
                                                    </div>
                                                </div>
                                                <span className="text-sm font-bold w-10 text-right text-gray-700">
                                                    {mod >= 0 ? '+' : ''}{mod}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            
                            <div className="bg-white/50 p-4 border-2 border-gray-400 rounded-lg shadow-sm flex justify-around text-center">
                                <div>
                                    <div className="text-xs font-bold text-gray-600 uppercase">Armor Class</div>
                                    <div className="text-3xl font-bold text-red-900">{character.armorClass}</div>
                                </div>
                                <div>
                                    <div className="text-xs font-bold text-gray-600 uppercase">Max HP</div>
                                    <div className="text-3xl font-bold text-red-900">{character.maxHp}</div>
                                </div>
                            </div>
                        </div>

                        {/* Details Column */}
                        <div className="col-span-1 md:col-span-2 space-y-4">
                            <div className="bg-white/50 p-4 border-2 border-gray-400 rounded-lg shadow-sm h-full flex flex-col">
                                <h3 className="font-bold text-gray-800 border-b border-gray-400 pb-1 mb-3 uppercase tracking-widest text-sm">Features, Traits & Abilities</h3>
                                {character.features && character.features.length > 0 ? (
                                    <div className="space-y-3 overflow-y-auto max-h-[400px] pr-2">
                                        {character.features.map((feature, idx) => (
                                            <div key={idx} className="bg-white p-3 rounded border border-gray-300 text-sm shadow-sm">
                                                <span className="font-bold text-red-900 block mb-1">{feature.name}</span>
                                                <div className="text-gray-700 text-xs leading-relaxed space-y-1">
                                                    {feature.desc ? feature.desc.map((p, i) => <p key={i}>{p}</p>) : <p>No description available.</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <p className="text-sm text-gray-500 italic flex-grow">
                                        {character.charClass ? "No features available for this selection." : "Select a class to gain abilities."}
                                    </p>
                                )}

                                <h3 className="font-bold text-gray-800 border-b border-gray-400 pb-1 mb-3 mt-6 uppercase tracking-widest text-sm">Spellbook ({character.spells.length})</h3>
                                {character.spells.length > 0 ? (
                                    <ul className="space-y-2">
                                        {character.spells.map((spell, idx) => (
                                            <li key={idx} className="bg-white p-2 rounded border border-gray-300 text-sm flex justify-between">
                                                <span className="font-bold text-red-900">{spell.name}</span>
                                                <span className="text-gray-500 text-xs">Level {spell.level} • {spell.school?.name}</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <p className="text-sm text-gray-500 italic">No spells learned.</p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SpellSelector = ({ character, setCharacter }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [spellList, setSpellList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedSpellDetails, setSelectedSpellDetails] = useState(null);

            useEffect(() => {
                const loadSpells = async () => {
                    setLoading(true);
                    const spells = await fetchAPI('spells');
                    setSpellList(spells.length > 0 ? spells : [
                        { index: 'fireball', name: 'Fireball', url: '/api/spells/fireball' },
                        { index: 'cure-wounds', name: 'Cure Wounds', url: '/api/spells/cure-wounds' },
                        { index: 'magic-missile', name: 'Magic Missile', url: '/api/spells/magic-missile' },
                        { index: 'shield', name: 'Shield', url: '/api/spells/shield' }
                    ]);
                    setLoading(false);
                };
                loadSpells();
            }, []);

            const filteredSpells = spellList.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()));

            const viewSpell = async (url) => {
                const details = await fetchDetails(url);
                setSelectedSpellDetails(details || {
                    name: "Spell Details",
                    level: 1,
                    school: { name: "Evocation" },
                    casting_time: "1 action",
                    range: "60 feet",
                    components: ["V", "S"],
                    duration: "Instantaneous",
                    desc: ["A powerful magical effect."]
                });
            };

            const addSpell = (spellInfo) => {
                if (!character.spells.find(s => s.index === spellInfo.index)) {
                    setCharacter({...character, spells: [...character.spells, spellInfo]});
                }
            };

            const removeSpell = (spellIndex) => {
                setCharacter({...character, spells: character.spells.filter(s => s.index !== spellIndex)});
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[600px]">
                    <div className="bg-stone-800 p-4 rounded-lg flex flex-col h-full border border-stone-700">
                        <h3 className="text-xl font-bold mb-4 text-dndRed"><i className="fa-solid fa-book-journal-whills mr-2"></i>Grimoire Search</h3>
                        <input 
                            type="text" 
                            placeholder="Search spells..." 
                            className="w-full p-3 rounded bg-stone-900 text-white border border-stone-600 focus:border-dndRed focus:outline-none mb-4"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <div className="overflow-y-auto flex-grow pr-2 space-y-2">
                            {loading ? <div className="flex justify-center"><div className="loader"></div></div> : 
                                filteredSpells.map(spell => (
                                    <div key={spell.index} className="flex justify-between items-center bg-stone-700 p-2 rounded hover:bg-stone-600 transition">
                                        <span className="cursor-pointer font-medium" onClick={() => viewSpell(spell.url)}>{spell.name}</span>
                                        <button onClick={() => viewSpell(spell.url)} className="text-xs bg-stone-900 px-2 py-1 rounded text-gray-300 hover:text-white">View</button>
                                    </div>
                                ))
                            }
                        </div>
                    </div>

                    <div className="bg-stone-800 p-4 rounded-lg flex flex-col h-full border border-stone-700 overflow-y-auto">
                        {selectedSpellDetails ? (
                            <div className="space-y-3">
                                <div className="flex justify-between items-start">
                                    <h3 className="text-2xl font-bold text-white">{selectedSpellDetails.name}</h3>
                                    <button 
                                        onClick={() => addSpell(selectedSpellDetails)}
                                        className="bg-dndRed hover:bg-red-700 text-white px-3 py-1 rounded font-bold shadow-lg"
                                    >
                                        <i className="fa-solid fa-plus mr-1"></i> Learn
                                    </button>
                                </div>
                                <div className="text-sm text-gray-400 italic mb-2 border-b border-stone-600 pb-2">
                                    Level {selectedSpellDetails.level} {selectedSpellDetails.school?.name}
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-sm text-gray-300 mb-4 bg-stone-900 p-3 rounded">
                                    <div><strong>Casting Time:</strong> {selectedSpellDetails.casting_time}</div>
                                    <div><strong>Range:</strong> {selectedSpellDetails.range}</div>
                                    <div><strong>Components:</strong> {selectedSpellDetails.components ? selectedSpellDetails.components.join(", ") : "V, S"}</div>
                                    <div><strong>Duration:</strong> {selectedSpellDetails.duration}</div>
                                </div>
                                <div className="text-sm text-gray-200 space-y-2">
                                    {selectedSpellDetails.desc ? selectedSpellDetails.desc.map((p, i) => <p key={i}>{p}</p>) : <p>Magical effect.</p>}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-grow flex items-center justify-center text-stone-500 italic text-center">
                                Select a spell from the list to view its complete details.
                            </div>
                        )}

                        <div className="mt-8 border-t border-stone-600 pt-4">
                            <h4 className="font-bold text-dndRed mb-2">Your Known Spells ({character.spells.length})</h4>
                            <div className="flex flex-wrap gap-2">
                                {character.spells.map(s => (
                                    <span key={s.index} className="bg-stone-900 border border-stone-600 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                                        {s.name}
                                        <i className="fa-solid fa-xmark text-red-500 cursor-pointer hover:text-red-400" onClick={() => removeSpell(s.index)}></i>
                                    </span>
                                ))}
                                {character.spells.length === 0 && <span className="text-sm text-stone-500">None</span>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(true);
            
            const [apiData, setApiData] = useState({
                classes: [],
                races: []
            });

            const [subclasses, setSubclasses] = useState([]);

            const [character, setCharacter] = useState({
                name: "",
                level: 1,
                race: null,
                charClass: null,
                subclass: null,
                baseStats: { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 },
                racialBonuses: { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 },
                asiBonuses: { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 },
                armorClass: 10,
                maxHp: 10,
                spells: [],
                features: [],
                equipment: { armorType: 'none', shield: false }
            });

            const loadAppData = async () => {
                setLoading(true);
                try {
                    const classes = await fetchAPI('classes');
                    const races = await fetchAPI('races');
                    
                    const finalClasses = classes.length > 0 ? classes : FALLBACK_CLASSES;
                    const finalRaces = races.length > 0 ? races : FALLBACK_RACES;

                    const hasArtificer = finalClasses.some(c => c.index === 'artificer');
                    if (!hasArtificer) {
                        finalClasses.push({ index: 'artificer', name: 'Artificer', url: '/api/classes/artificer' });
                        finalClasses.sort((a, b) => a.name.localeCompare(b.name));
                    }

                    setApiData({ classes: finalClasses, races: finalRaces });
                } catch (err) {
                    setApiData({ classes: FALLBACK_CLASSES, races: FALLBACK_RACES });
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadAppData();
            }, []);

            useEffect(() => {
                const loadSubclasses = async () => {
                    if (!character.charClass) {
                        setSubclasses([]);
                        return;
                    }
                    const apiSubs = await fetchAPI(`classes/${character.charClass.index}/subclasses`);
                    const fallbackSubs = COMPREHENSIVE_SUBCLASSES[character.charClass.index] || [];
                    
                    const combinedMap = new Map();
                    fallbackSubs.forEach(s => combinedMap.set(s.index, s));
                    apiSubs.forEach(s => combinedMap.set(s.index, s));
                    
                    setSubclasses(Array.from(combinedMap.values()));
                };
                loadSubclasses();
            }, [character.charClass?.index]);

            useEffect(() => {
                const loadRaceBonuses = async () => {
                    if (!character.race) return;
                    const details = await fetchDetails(character.race.url);
                    const newRacial = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
                    if (details && details.ability_bonuses) {
                        details.ability_bonuses.forEach(b => {
                            const name = b.ability_score.name.toUpperCase();
                            let key = name;
                            if (name === 'STRENGTH') key = 'STR';
                            if (name === 'DEXTERITY') key = 'DEX';
                            if (name === 'CONSTITUTION') key = 'CON';
                            if (name === 'INTELLIGENCE') key = 'INT';
                            if (name === 'WISDOM') key = 'WIS';
                            if (name === 'CHARISMA') key = 'CHA';
                            newRacial[key] = b.bonus;
                        });
                    }
                    updateDerivedStats(character.baseStats, newRacial, character.asiBonuses, character.equipment, character.level, character.charClass);
                };
                loadRaceBonuses();
            }, [character.race?.index]);

            // Robust and error-free feature loader with guaranteed fallbacks
            useEffect(() => {
                const loadFeatures = async () => {
                    if (!character.charClass) {
                        setCharacter(prev => ({ ...prev, features: [] }));
                        return;
                    }
                    const classKey = character.charClass.index;
                    const fallbackList = CLASS_FEATURES_FALLBACK[classKey] || [
                        { name: `${character.charClass.name} Training`, desc: [`Standard training and proficiency associated with level ${character.level} ${character.charClass.name}.`] }
                    ];

                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        const response = await fetch(`${API_BASE}/classes/${classKey}/levels`, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        
                        if (response.ok) {
                            const levelsData = await response.json();
                            const levelsArray = Array.isArray(levelsData) ? levelsData : (levelsData.results || []);
                            let featureUrls = [];
                            levelsArray.forEach(lvl => {
                                if (lvl.level <= character.level && lvl.features) {
                                    lvl.features.forEach(f => featureUrls.push(f.url));
                                }
                            });
                            if (featureUrls.length > 0) {
                                featureUrls = [...new Set(featureUrls)].slice(0, 8);
                                const fetchedDetails = await Promise.all(
                                    featureUrls.map(url => fetchDetails(url).catch(() => null))
                                );
                                const validDetails = fetchedDetails.filter(Boolean);
                                if (validDetails.length > 0) {
                                    setCharacter(prev => ({ ...prev, features: validDetails }));
                                    return;
                                }
                            }
                        }
                    } catch (err) {
                        // Silent fallback - no errors logged
                    }

                    setCharacter(prev => ({
                        ...prev,
                        features: fallbackList
                    }));
                };
                loadFeatures();
            }, [character.charClass?.index, character.level]);

            const updateDerivedStats = (baseStats, racialBonuses, asiBonuses, equipment, level, charClass) => {
                const finalStats = {};
                ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].forEach(stat => {
                    finalStats[stat] = (baseStats[stat] || 10) + (racialBonuses[stat] || 0) + (asiBonuses[stat] || 0);
                });

                const conMod = Math.floor((finalStats.CON - 10) / 2);
                const dexMod = Math.floor((finalStats.DEX - 10) / 2);
                
                let hitDie = 8;
                if (charClass) {
                    const c = charClass.index;
                    if (['wizard', 'sorcerer'].includes(c)) hitDie = 6;
                    else if (['bard', 'cleric', 'druid', 'monk', 'rogue', 'warlock'].includes(c)) hitDie = 8;
                    else if (['fighter', 'paladin', 'ranger', 'artificer'].includes(c)) hitDie = 10;
                    else if (['barbarian'].includes(c)) hitDie = 12;
                }
                const avgHpPerLevel = Math.floor(hitDie / 2) + 1;
                const maxHp = Math.max(level, (hitDie + conMod) + (level > 1 ? (avgHpPerLevel + conMod) * (level - 1) : 0));

                let armorClass = 10;
                if (equipment.armorType === 'none') {
                    armorClass = 10 + dexMod;
                } else if (equipment.armorType === 'light') {
                    armorClass = 11 + dexMod;
                } else if (equipment.armorType === 'medium') {
                    armorClass = 14 + Math.min(2, dexMod);
                } else if (equipment.armorType === 'heavy') {
                    armorClass = 16;
                } else if (equipment.armorType === 'plate') {
                    armorClass = 18;
                }

                if (equipment.shield) {
                    armorClass += 2;
                }

                setCharacter(prev => ({
                    ...prev,
                    level,
                    charClass,
                    equipment,
                    baseStats,
                    racialBonuses,
                    asiBonuses,
                    maxHp,
                    armorClass
                }));
            };

            const updateBaseStat = (stat, value) => {
                const newBase = { ...character.baseStats, [stat]: parseInt(value) || 0 };
                updateDerivedStats(newBase, character.racialBonuses, character.asiBonuses, character.equipment, character.level, character.charClass);
            };

            const updateAsiBonus = (stat, delta) => {
                const currentVal = character.asiBonuses[stat] || 0;
                const newVal = currentVal + delta;
                if (newVal < 0) return;
                
                const totalAllowed = getAsiCount(character.charClass, character.level) * 2;
                const currentSpent = Object.entries(character.asiBonuses).reduce((acc, [s, v]) => s === stat ? acc + newVal : acc + v, 0);
                
                if (delta > 0 && currentSpent > totalAllowed) return;

                const newAsi = { ...character.asiBonuses, [stat]: newVal };
                updateDerivedStats(character.baseStats, character.racialBonuses, newAsi, character.equipment, character.level, character.charClass);
            };

            const updateEquipment = (key, value) => {
                const newEq = { ...character.equipment, [key]: value };
                updateDerivedStats(character.baseStats, character.racialBonuses, character.asiBonuses, newEq, character.level, character.charClass);
            };

            const nextStep = () => setStep(s => Math.min(s + 1, 5));
            const prevStep = () => setStep(s => Math.max(s - 1, 1));

            if (loading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center text-white">
                        <div className="loader mb-4"></div>
                        <p className="font-serif text-lg tracking-wider">Loading D&D 5e Character Forge...</p>
                    </div>
                );
            }

            const totalAsiAllowed = getAsiCount(character.charClass, character.level) * 2;
            const totalAsiSpent = Object.values(character.asiBonuses).reduce((a, b) => a + b, 0);
            const asiRemaining = totalAsiAllowed - totalAsiSpent;

            return (
                <div className="container mx-auto p-4 md:p-8">
                    {/* Header */}
                    <header className="mb-8 text-center relative">
                        <div className="absolute right-0 top-0">
                            <button 
                                onClick={loadAppData}
                                title="Reload API Data"
                                className="bg-stone-800 hover:bg-stone-700 text-stone-300 px-3 py-2 rounded text-xs border border-stone-700 transition flex items-center gap-2"
                            >
                                <i className="fa-solid fa-rotate"></i> Refresh API
                            </button>
                        </div>
                        <h1 className="text-4xl md:text-5xl font-bold text-white tracking-widest uppercase font-serif drop-shadow-md">
                            <span className="text-dndRed">D&D 5e</span> Character Forge
                        </h1>
                        <p className="text-stone-400 mt-2">Official D&D 5e API & Fallback Integration</p>
                    </header>

                    {/* Progress Bar */}
                    {step < 5 && (
                        <div className="max-w-3xl mx-auto mb-8 flex justify-between relative">
                            <div className="absolute top-1/2 left-0 w-full h-1 bg-stone-800 -z-10 transform -translate-y-1/2"></div>
                            {['Basics', 'Race & Class', 'Abilities & ASI', 'Spells'].map((label, idx) => (
                                <div key={idx} className={`flex flex-col items-center ${step >= idx + 1 ? 'text-dndRed' : 'text-stone-600'}`}>
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold mb-2 ${step >= idx + 1 ? 'bg-dndRed text-white shadow-[0_0_10px_rgba(226,40,34,0.6)]' : 'bg-stone-800'}`}>
                                        {idx + 1}
                                    </div>
                                    <span className="text-xs uppercase font-bold tracking-wider bg-[#121212] px-2">{label}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="max-w-5xl mx-auto bg-stone-900/80 p-6 md:p-8 rounded-xl shadow-2xl border border-stone-800 backdrop-blur-sm">
                        
                        {/* STEP 1: Name & Level */}
                        {step === 1 && (
                            <div className="space-y-6 max-w-xl mx-auto">
                                <h2 className="text-2xl font-bold text-white mb-6 border-b border-stone-700 pb-2">1. Who are you?</h2>
                                
                                <div>
                                    <label className="block text-stone-400 font-bold mb-2">Character Name</label>
                                    <input 
                                        type="text" 
                                        className="w-full p-4 rounded bg-stone-800 text-xl text-white border border-stone-600 focus:border-dndRed focus:outline-none focus:ring-1 focus:ring-dndRed transition"
                                        placeholder="E.g. Drizzt Do'Urden"
                                        value={character.name}
                                        onChange={(e) => setCharacter({...character, name: e.target.value})}
                                    />
                                </div>

                                <div>
                                    <label className="block text-stone-400 font-bold mb-2">Level (1-20)</label>
                                    <input 
                                        type="number" 
                                        min="1" max="20"
                                        className="w-full p-4 rounded bg-stone-800 text-xl text-white border border-stone-600 focus:border-dndRed focus:outline-none focus:ring-1 focus:ring-dndRed transition"
                                        value={character.level}
                                        onChange={(e) => {
                                            const lvl = parseInt(e.target.value) || 1;
                                            const newLvl = lvl > 20 ? 20 : (lvl < 1 ? 1 : lvl);
                                            updateDerivedStats(character.baseStats, character.racialBonuses, character.asiBonuses, character.equipment, newLvl, character.charClass);
                                        }}
                                    />
                                    <p className="text-stone-500 text-xs mt-1">Leveling up automatically adjusts Hit Points, features, and Ability Score Improvements (ASIs).</p>
                                </div>
                            </div>
                        )}

                        {/* STEP 2: Race & Class */}
                        {step === 2 && (
                            <div className="space-y-8">
                                <h2 className="text-2xl font-bold text-white mb-6 border-b border-stone-700 pb-2">2. Origins, Profession & Archetype</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label className="block text-stone-400 font-bold mb-4 uppercase tracking-wider text-sm"><i className="fa-solid fa-users mr-2"></i>Select Race</label>
                                        <div className="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                                            {apiData.races.map(race => (
                                                <button 
                                                    key={race.index}
                                                    onClick={() => setCharacter({...character, race})}
                                                    className={`w-full p-3 rounded text-left transition border ${character.race?.index === race.index ? 'bg-dndRed/20 border-dndRed text-white shadow-[0_0_15px_rgba(226,40,34,0.3)]' : 'bg-stone-800 border-stone-700 text-stone-300 hover:bg-stone-700 hover:border-stone-500'}`}
                                                >
                                                    {race.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-stone-400 font-bold mb-4 uppercase tracking-wider text-sm"><i className="fa-solid fa-khanda mr-2"></i>Select Class</label>
                                        <div className="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                                            {apiData.classes.map(cls => (
                                                <button 
                                                    key={cls.index}
                                                    onClick={() => {
                                                        const newAsiAllowed = getAsiCount(cls, character.level) * 2;
                                                        let newAsi = { ...character.asiBonuses };
                                                        if (Object.values(newAsi).reduce((a,b)=>a+b,0) > newAsiAllowed) {
                                                            newAsi = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
                                                        }
                                                        updateDerivedStats(character.baseStats, character.racialBonuses, newAsi, character.equipment, character.level, cls);
                                                        setCharacter(prev => ({ ...prev, charClass: cls, subclass: null }));
                                                    }}
                                                    className={`w-full p-3 rounded text-left transition border ${character.charClass?.index === cls.index ? 'bg-dndRed/20 border-dndRed text-white shadow-[0_0_15px_rgba(226,40,34,0.3)]' : 'bg-stone-800 border-stone-700 text-stone-300 hover:bg-stone-700 hover:border-stone-500'}`}
                                                >
                                                    {cls.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-stone-400 font-bold mb-4 uppercase tracking-wider text-sm"><i className="fa-solid fa-shield-cat mr-2"></i>Select Subclass</label>
                                        <div className="space-y-2 max-h-[350px] overflow-y-auto pr-1">
                                            {character.charClass ? (
                                                subclasses.length > 0 ? (
                                                    subclasses.map(sub => (
                                                        <button 
                                                            key={sub.index}
                                                            onClick={() => setCharacter({...character, subclass: sub})}
                                                            className={`w-full p-3 rounded text-left transition border ${character.subclass?.index === sub.index ? 'bg-dndRed/20 border-dndRed text-white shadow-[0_0_15px_rgba(226,40,34,0.3)]' : 'bg-stone-800 border-stone-700 text-stone-300 hover:bg-stone-700 hover:border-stone-500'}`}
                                                        >
                                                            {sub.name}
                                                        </button>
                                                    ))
                                                ) : (
                                                    <p className="text-sm text-stone-500 italic p-3 bg-stone-800 rounded border border-stone-700">Loading subclasses...</p>
                                                )
                                            ) : (
                                                <p className="text-sm text-stone-500 italic p-3 bg-stone-800 rounded border border-stone-700">Select a class first.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STEP 3: Ability Scores & ASIs */}
                        {step === 3 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-white mb-2 border-b border-stone-700 pb-2">3. Ability Scores, Racial Bonuses & ASIs</h2>
                                
                                <div className="flex flex-wrap items-center justify-between gap-4 bg-stone-800 p-4 rounded-lg border border-stone-700">
                                    <p className="text-stone-300 text-sm">Roll stats (4d6 drop lowest), use Standard Array, and assign earned Ability Score Improvements (ASIs).</p>
                                    <div className="flex gap-3">
                                        <button 
                                            onClick={() => {
                                                const roll4d6 = () => {
                                                    const rolls = [
                                                        Math.floor(Math.random() * 6) + 1,
                                                        Math.floor(Math.random() * 6) + 1,
                                                        Math.floor(Math.random() * 6) + 1,
                                                        Math.floor(Math.random() * 6) + 1
                                                    ].sort((a, b) => a - b);
                                                    rolls.shift();
                                                    return rolls.reduce((a, b) => a + b, 0);
                                                };
                                                const newBase = {
                                                    STR: roll4d6(),
                                                    DEX: roll4d6(),
                                                    CON: roll4d6(),
                                                    INT: roll4d6(),
                                                    WIS: roll4d6(),
                                                    CHA: roll4d6()
                                                };
                                                updateDerivedStats(newBase, character.racialBonuses, character.asiBonuses, character.equipment, character.level, character.charClass);
                                            }}
                                            className="px-4 py-2 bg-dndRed hover:bg-red-700 text-white font-bold rounded shadow transition flex items-center gap-2 text-sm"
                                        >
                                            <i className="fa-solid fa-dice"></i> Roll 4d6
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const standard = [15, 14, 13, 12, 10, 8];
                                                const statKeys = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
                                                const newBase = {};
                                                statKeys.forEach((stat, idx) => { newBase[stat] = standard[idx]; });
                                                updateDerivedStats(newBase, character.racialBonuses, character.asiBonuses, character.equipment, character.level, character.charClass);
                                            }}
                                            className="px-4 py-2 bg-stone-700 hover:bg-stone-600 text-white font-bold rounded transition text-sm"
                                        >
                                            Standard Array (15,14,13,12,10,8)
                                        </button>
                                    </div>
                                </div>

                                {totalAsiAllowed > 0 && (
                                    <div className="bg-stone-800/90 border border-stone-700 p-4 rounded-lg flex justify-between items-center text-sm">
                                        <div>
                                            <span className="font-bold text-white">Level {character.level} {character.charClass?.name}: </span>
                                            <span className="text-stone-300">Ability Score Improvement (ASI) Points Available: </span>
                                            <span className={`font-bold text-lg ml-1 ${asiRemaining === 0 ? 'text-green-400' : 'text-dndRed'}`}>{asiRemaining}</span> / {totalAsiAllowed}
                                        </div>
                                    </div>
                                )}
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                                    {['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'].map(stat => {
                                        const base = character.baseStats[stat] || 10;
                                        const racial = character.racialBonuses[stat] || 0;
                                        const asi = character.asiBonuses[stat] || 0;
                                        const total = base + racial + asi;
                                        const mod = Math.floor((total - 10) / 2);

                                        return (
                                            <div key={stat} className="bg-stone-800 p-4 rounded-lg border border-stone-700 space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-white text-lg">{stat}</span>
                                                    <div className="text-right">
                                                        <span className="text-2xl font-bold text-dndRed">{total}</span>
                                                        <span className="text-xs text-stone-400 ml-1">({mod >= 0 ? '+' : ''}{mod})</span>
                                                    </div>
                                                </div>

                                                <div className="text-xs text-stone-400 flex justify-between bg-stone-900 p-2 rounded">
                                                    <span>Base: <input type="number" min="1" max="20" value={base} onChange={(e) => updateBaseStat(stat, e.target.value)} className="w-12 bg-stone-800 text-white text-center rounded border border-stone-700 ml-1"/></span>
                                                    <span>Racial: <strong className="text-stone-200">+{racial}</strong></span>
                                                    <span>ASI: <strong className="text-green-400">+{asi}</strong></span>
                                                </div>

                                                {totalAsiAllowed > 0 && (
                                                    <div className="flex justify-between items-center pt-1 border-t border-stone-700 text-xs">
                                                        <span className="text-stone-300 font-medium">ASI Points (+):</span>
                                                        <div className="flex items-center gap-2">
                                                            <button 
                                                                onClick={() => updateAsiBonus(stat, -1)}
                                                                className="w-7 h-7 bg-stone-700 hover:bg-stone-600 text-white rounded font-bold"
                                                            >-</button>
                                                            <span className="w-6 text-center font-bold text-white">{asi}</span>
                                                            <button 
                                                                onClick={() => updateAsiBonus(stat, 1)}
                                                                className="w-7 h-7 bg-dndRed hover:bg-red-700 text-white rounded font-bold"
                                                            >+</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-stone-800 p-6 rounded-lg border border-stone-700 mt-6">
                                    <h3 className="text-lg font-bold text-white mb-4"><i className="fa-solid fa-shield-halved mr-2"></i>Armor & Equipment (AC Calculation)</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-stone-400 text-sm font-bold mb-2">Armor Type</label>
                                            <select 
                                                className="w-full p-3 rounded bg-stone-900 text-white border border-stone-700 focus:border-dndRed focus:outline-none"
                                                value={character.equipment.armorType || 'none'}
                                                onChange={(e) => updateEquipment('armorType', e.target.value)}
                                            >
                                                <option value="none">Unarmored (10 + DEX)</option>
                                                <option value="light">Light Armor / Leather (11 + DEX)</option>
                                                <option value="medium">Medium Armor / Scale Mail (14 + DEX, max +2)</option>
                                                <option value="heavy">Heavy Armor / Chain Mail (16 flat)</option>
                                                <option value="plate">Full Plate (18 flat)</option>
                                            </select>
                                        </div>
                                        <div className="flex items-center pt-6">
                                            <label className="flex items-center gap-3 text-stone-300 cursor-pointer hover:text-white transition">
                                                <input 
                                                    type="checkbox" 
                                                    className="w-5 h-5 accent-dndRed"
                                                    checked={character.equipment.shield || false}
                                                    onChange={(e) => updateEquipment('shield', e.target.checked)}
                                                />
                                                <span className="font-bold">Equip Shield (+2 AC)</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div className="mt-4 text-xs text-stone-400 bg-stone-900 p-3 rounded border border-stone-700">
                                        Current Calculated Armor Class (AC): <strong className="text-dndRed text-base ml-1">{character.armorClass}</strong>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STEP 4: Spells API Integration */}
                        {step === 4 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-white mb-2 border-b border-stone-700 pb-2">4. Spellcasting & Grimoire</h2>
                                <p className="text-stone-400 mb-6">
                                    Search and add spells to your character's spellbook.
                                </p>
                                <SpellSelector character={character} setCharacter={setCharacter} />
                            </div>
                        )}

                        {/* STEP 5: Final Sheet Review */}
                        {step === 5 && (
                            <div className="animation-fade-in">
                                <CharacterSheet character={character} onEdit={() => setStep(1)} />
                            </div>
                        )}

                        {/* Navigation Buttons */}
                        {step < 5 && (
                            <div className="mt-10 flex justify-between border-t border-stone-800 pt-6">
                                <button 
                                    onClick={prevStep}
                                    disabled={step === 1}
                                    className={`px-6 py-3 rounded font-bold transition ${step === 1 ? 'opacity-0 cursor-default' : 'bg-stone-800 hover:bg-stone-700 text-white'}`}
                                >
                                    <i className="fa-solid fa-arrow-left mr-2"></i> Back
                                </button>
                                
                                <button 
                                    onClick={nextStep}
                                    className="px-8 py-3 rounded font-bold bg-dndRed hover:bg-red-700 text-white shadow-[0_4px_14px_0_rgba(226,40,34,0.39)] transition duration-200"
                                >
                                    {step === 4 ? 'Forge Character' : 'Next Step'} <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        )}

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
